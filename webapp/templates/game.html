<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game - Overcooked Study</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="game-header">
            <h2>Round <span id="roundNum">{{ round_num }}</span> of {{ total_rounds }}</h2>
            <div class="model-info">Playing with: <strong id="modelName">{{ model_name }}</strong></div>
        </div>

        <div class="game-container">
            <canvas id="gameCanvas" width="700" height="1300"></canvas>
            <div class="game-info">
                <div class="info-item">
                    <span class="label">Score:</span>
                    <span id="score" class="value">0</span>
                </div>
                <div class="info-item">
                    <span class="label">Time:</span>
                    <span id="timer" class="value">0s</span>
                </div>
            </div>
            <div id="status" class="status">Ready</div>
        </div>

        <div class="controls-hint">
            <p>↑ ↓ ← → to move | Space to interact</p>
        </div>
    </div>

    <script>
        const PARTICIPANT_ID = "{{ participant_id }}";
        const CURRENT_ROUND = {{ round_num }};
        const TOTAL_ROUNDS = {{ total_rounds }};
        const MODEL_ID = "{{ model_id }}";
        const LEVEL_ID = "{{ level_id }}";
        const IS_DEMO = false;
    </script>
    <script src="/static/js/game.js"></script>
</body>
</html>
